<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="TH Cell JM — Manutenção de Eletrônicos & Acessórios">
<title>TH Cell JM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#05080d}
body{font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center}
.page{position:relative;width:100%;max-width:706px;line-height:0;overflow:hidden}
.page img{display:block;width:100%;height:auto}
.hit{position:absolute;display:block;border:0;background:transparent;border-radius:22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:3px solid #fff;outline-offset:3px}
.whatsapp{left:5.8%;top:41.8%;width:88.8%;height:6.1%}
.instagram{left:5.8%;top:49.6%;width:43.4%;height:7.0%}
.maps{left:51.0%;top:49.6%;width:43.2%;height:7.0%}
.review{left:5.8%;top:57.6%;width:43.4%;height:7.0%}
.pix{left:51.0%;top:57.6%;width:43.2%;height:7.0%}
.wifi{left:5.8%;top:65.9%;width:88.8%;height:6.8%}
.toast{
 position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
 background:rgba(12,18,27,.96);color:#fff;border:1px solid #2b8cff;
 padding:12px 18px;border-radius:14px;font-size:14px;line-height:1.2;
 opacity:0;pointer-events:none;transition:.2s;z-index:99;
 box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){
 .hit{border-radius:16px}
}
@media (prefers-reduced-motion:reduce){
 .toast{transition:none}
}
</style>
</head>
<body>
<main class="page" aria-label="TH Cell JM">
  <img src="thcell-page.jpg" alt="TH Cell JM — manutenção de eletrônicos e acessórios">
  <a class="hit whatsapp" href="https://wa.me/5531975160470" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"></a>
  <a class="hit instagram" href="https://instagram.com/thcell_jm" target="_blank" rel="noopener" aria-label="Abrir Instagram @thcell_jm"></a>
  <a class="hit maps" href="https://www.google.com/maps/search/?api=1&query=THCELL_%20celulares%2C%20R.%20Andrade%2C%2011%2C%20Jo%C3%A3o%20Monlevade%20-%20MG%2C%2035930-196" target="_blank" rel="noopener" aria-label="Abrir localização no Google Maps"></a>
  <a class="hit review" href="https://search.google.com/local/writereview?placeid=ChIJ60befgAHpQARRae2eo5F6-Y" target="_blank" rel="noopener" aria-label="Avaliar TH Cell JM no Google"></a>
  <button class="hit pix" type="button" aria-label="Copiar chave Pix"></button>
  <button class="hit wifi" type="button" aria-label="Copiar rede e senha do Wi-Fi"></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</main>
<script>
(() => {
  const pix = "thalesaraujo2008@hotmail.com";
  const wifi = "31975160470th";
  const toast = document.getElementById("toast");
  let timer;
  function show(message){
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(() => toast.classList.remove("show"), 1800);
  }
  async function copy(text, ok){
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    show(ok);
  }
  document.querySelector(".pix").addEventListener("click", () => copy(pix, "Chave PIX copiada!"));
  document.querySelector(".wifi").addEventListener("click", () => copy(wifi, "Senha do Wi-Fi copiada!"));
})();
</script>
</body>
</html>
